depends_on:
  - lint
  - test
  - security

when:
  - event: push
    branch: main

steps:
  - name: build-and-push
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: 192.168.76.202:3000/pedro/recall-server
      registry: 192.168.76.202:3000
      tags: latest,${CI_COMMIT_SHA:0:8}
      dockerfile: Dockerfile
      insecure: true
      username:
        from_secret: REGISTRY_USER
      password:
        from_secret: REGISTRY_PASS

