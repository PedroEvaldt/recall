# ============================================================
# Secret — credenciais sensíveis (DB_URL e AUTH_TOKEN)
# ============================================================
# O Secret "recall-secret" NÃO é versionado neste manifest pra
# não vazar credenciais no git. Crie-o uma vez no cluster com:
#
#   kubectl create secret generic recall-secret \
#     --from-literal=DB_URL='postgres://recall:recall@postgres-svc:5432/recall?sslmode=disable' \
#     --from-literal=AUTH_TOKEN="$(openssl rand -hex 32)"
#
# Pra recuperar o token depois:
#   kubectl get secret recall-secret -o jsonpath='{.data.AUTH_TOKEN}' | base64 -d
#
# Em produção: SOPS, Sealed Secrets ou External Secrets.

# ============================================================
# Deployment do recall server
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recall-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recall-server
  template:
    metadata:
      labels:
        app: recall-server
    spec:
      containers:
        - name: recall-server
          image: 192.168.76.202:3000/pedro/recall-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: recall-secret
                  key: DB_URL
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: recall-secret
                  key: AUTH_TOKEN
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: "8080"
            - name: STORAGE_PATH
              value: "/data/storage"
          # volumeMount conecta o volume ao filesystem do container
          volumeMounts:
            - name: recall-storage
              mountPath: /data/storage    # caminho dentro do pod
          # livenessProbe: k8s faz GET /health a cada 30s
          # Se falhar 3x seguidas, mata o pod e recria
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          # readinessProbe: só envia tráfego pro pod quando
          # o /health responder 200. Evita requests durante startup.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: recall-storage
          # hostPath monta um diretório do host (container LXC)
          # dentro do pod. /mnt/datapool é o ZFS que montamos
          # dos HDs em mirror. Tudo gravado aqui fica nos HDs
          # com redundância automática.
          hostPath:
            path: /mnt/datapool/storage
            type: DirectoryOrCreate    # cria se não existir

---
# ============================================================
# Service — expõe o recall server dentro do cluster
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: recall-svc
spec:
  type: NodePort          # expõe na rede do container LXC
  selector:
    app: recall-server
  ports:
    - port: 8080          # porta interna do cluster
      targetPort: 8080    # porta do container
      nodePort: 30080     # porta fixa acessível de fora do cluster
