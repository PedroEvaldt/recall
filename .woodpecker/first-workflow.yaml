# Recall pipeline

when:
  - event: push
    branch: main


steps:
  # Run tests
  - name: test
    image: golang:1.26.2-alpine
    commands:
      - go test ./...

  # Build docker image
  - name: build
    image: woodpecker/plugin-docker-buildx
    settings: 
      auto_tag: true
      repo: recall-server
      dry_run: true # just build, do not push it yet
      dockerfile: Dockerfile

