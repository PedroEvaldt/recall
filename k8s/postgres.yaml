# ============================================================
# Secret — credenciais do banco de dados
# ============================================================
# Secret guarda dados sensíveis codificados em base64.
# O Kubernetes injeta como variável de ambiente no pod,
# separando segredos do código e dos manifests.
# Em produção usaria algo como Vault ou Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  # stringData aceita texto puro — o k8s converte pra base64
  # Note que o host é "postgres-svc" — o nome do Service que
  # criamos. Dentro do cluster, Kubernetes resolve esse nome
  # automaticamente via CoreDNS pro IP do pod do Postgres.
  POSTGRES_USER: "recall"
  POSTGRES_PASSWORD: "recall"
  POSTGRES_DB: "recall"

---

# ============================================================
# PersistentVolumeClaim — reserva 5GB de disco pro banco
# Os dados ficam no local-path (SSD do Proxmox por padrão)
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce       # só um pod por vez pode montar
  resources:
    requests:
      storage: 5Gi        # 5GB é mais que suficiente pra metadados
  storageClassName: local-path   # provisionador que o k3s traz built-in

---
# ============================================================
# Deployment — roda o pod do PostgreSQL 16
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1             # só 1 instância (banco não escala assim)
  selector:
    matchLabels:
      app: postgres       # identifica quais pods pertencem a esse Deployment
  template:
    metadata:
      labels:
        app: postgres     # label que o Service vai usar pra encontrar o pod
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine    # mesma versão do teu docker-compose
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              value: POSTGRES_PASSWORD         
            - name: POSTGRES_DB
              value: POSTGRES_DB
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data    # onde o Postgres guarda dados
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc    # referencia o PVC que criamos acima

---
# ============================================================
# Service — expõe o Postgres internamente no cluster
# Outros pods acessam via: postgres-svc:5432
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
spec:
  type: NodePort
  selector:
    app: postgres         # encontra pods com essa label
  ports:
    - port: 5432          # porta exposta no Service
      targetPort: 5432    # porta do container
      nodePort: 30432 
