depends_on:
  - build

when:
  - event: push
    branch: main

steps:
  - name: goose-up
    image: golang:1.26.2-alpine
    environment:
      GOOSE_URL:
        from_secret: GOOSE_URL
    commands:
      - go install github.com/pressly/goose/v3/cmd/goose@latest
      - goose -dir ./internal/storage/schemas postgres "$GOOSE_URL" up

