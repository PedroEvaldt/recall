# ============================================================
# Secret: sensitive server credentials
# ============================================================
# The "recall-secret" Secret is intentionally not versioned in this manifest,
# so credentials are not leaked into Git. Create it once in the cluster with:
#
#   kubectl create secret generic recall-secret \
#     --from-literal=DB_URL='postgres://recall:recall@postgres-svc:5432/recall?sslmode=disable' \
#     --from-literal=AUTH_TOKEN="$(openssl rand -hex 32)"
#
# To retrieve the token later:
#   kubectl get secret recall-secret -o jsonpath='{.data.AUTH_TOKEN}' | base64 -d
#
# Production deployments should use SOPS, Sealed Secrets, External Secrets, or
# another managed secret workflow.

# ============================================================
# Deployment: recall server
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recall-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recall-server
  template:
    metadata:
      labels:
        app: recall-server
    spec:
      containers:
        - name: recall-server
          image: 192.168.76.202:3000/pedro/recall-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: recall-secret
                  key: DB_URL
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: recall-secret
                  key: AUTH_TOKEN
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: "8080"
            - name: STORAGE_PATH
              value: "/data/storage"
          # Mount the persistent document storage directory inside the pod.
          volumeMounts:
            - name: recall-storage
              mountPath: /data/storage
          # Kubernetes restarts the pod if this liveness probe fails repeatedly.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          # Kubernetes sends traffic only after the readiness probe succeeds.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: recall-storage
          # hostPath mounts a directory from the Kubernetes node into the pod.
          # This manifest uses /mnt/datapool/storage as durable document storage.
          hostPath:
            path: /mnt/datapool/storage
            type: DirectoryOrCreate

---
# ============================================================
# Service: expose the recall server inside and outside the cluster
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: recall-svc
spec:
  type: NodePort
  selector:
    app: recall-server
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
