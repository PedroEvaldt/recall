# ============================================================
# Secret: PostgreSQL credentials
# ============================================================
# Kubernetes stores Secret values separately from manifests that reference them.
# stringData accepts plain text and Kubernetes converts it to base64 at rest.
# Production deployments should use Vault, SOPS, Sealed Secrets, External
# Secrets, or another managed secret workflow.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  # The service name "postgres-svc" is resolved inside the cluster by CoreDNS.
  POSTGRES_USER: "recall"
  POSTGRES_PASSWORD: "recall"
  POSTGRES_DB: "recall"

---

# ============================================================
# PersistentVolumeClaim: PostgreSQL data storage
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path

---
# ============================================================
# Deployment: PostgreSQL 16
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc

---
# ============================================================
# Service: expose PostgreSQL inside the cluster
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30432
