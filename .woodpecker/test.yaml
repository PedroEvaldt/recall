# Test pipeline: runs the Go test suite with coverage on every push.
when:
  - event: push

steps:
  - name: test
    image: golang:1.25-alpine
    commands:
      - go test -cover ./... # Unit tests for all pipelines
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
