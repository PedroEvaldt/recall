# Lint pipeline: verifies formatting and static analysis on every push.
when:
  - event: push

steps:
  - name: lint
    image: golangci/golangci-lint:v2.6-alpine
    commands:
      - golangci-lint run ./...
    volumes:
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
